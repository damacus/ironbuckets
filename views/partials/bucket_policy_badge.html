{{ define "bucket_policy_badge" }}
{{ if eq .PolicyType "public-read" }}
<span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded">Public Read</span>
{{ else if eq .PolicyType "public-read-write" }}
<span class="text-xs bg-yellow-500/10 text-yellow-400 px-2 py-1 rounded">Public Read/Write</span>
{{ else if eq .PolicyType "custom" }}
<span class="text-xs bg-accent/10 text-accent px-2 py-1 rounded">Custom</span>
{{ else if eq .PolicyType "unknown" }}
<span class="text-xs bg-red-500/10 text-red-400 px-2 py-1 rounded" {{ if .Error }}title="{{ .Error }}"{{ end }}>Unknown</span>
{{ else }}
<span class="text-xs bg-zinc-500/10 text-zinc-400 px-2 py-1 rounded">Private</span>
{{ end }}
{{ end }}
